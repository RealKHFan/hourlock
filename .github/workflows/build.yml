name: Build

# Tests and builds every push. Releases are signed and uploaded by hand,
# so the signing key never touches GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-33" "build-tools;36.0.0" > /dev/null

      - name: Test and build
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar" \
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" \
          ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Hourlock-apk-debug-signed
          path: build/Hourlock.apk
