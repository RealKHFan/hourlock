name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used to publish releases for v* tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-33" "build-tools;34.0.0" > /dev/null

      # Releases must be signed with the project's key so they update older
      # installs. The key lives only in the repo secrets, never in the code.
      - name: Restore release key (version tags only)
        id: key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets: building this tag, but not publishing it."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/unscroll.keystore
          printf '%s' "$KEYSTORE_PASSWORD" > signing/keystore-password.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar" \
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0" \
          ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Hourlock-apk
          path: build/Hourlock.apk

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/Hourlock.apk "Hourlock-$VERSION.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Hourlock-$VERSION.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Hourlock-$VERSION.apk" \
              --title "Hourlock $VERSION" --generate-notes
          fi
